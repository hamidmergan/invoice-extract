[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extract"
version = "0.1.0"
description = "Turn invoices (PDF, scans, e-invoices) into one table with columns you choose, using any OpenAI-compatible model"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hamid Mergan" }]
keywords = ["invoice", "pdf", "zugferd", "xrechnung", "factur-x", "excel", "llm", "ollama", "openai", "document-extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.30",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "doc-extract-llm>=0.1.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
ui = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]
test = ["pytest>=7", "httpx>=0.24", "fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]
dev = ["pytest>=7", "httpx>=0.24", "fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6", "build", "twine"]

[project.urls]
Homepage = "https://github.com/hamidmergan/invoice-extract"
Source = "https://github.com/hamidmergan/invoice-extract"
Issues = "https://github.com/hamidmergan/invoice-extract/issues"
Changelog = "https://github.com/hamidmergan/invoice-extract/blob/main/CHANGELOG.md"

[project.scripts]
invoice-extract = "invoice_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_extract = ["py.typed", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
