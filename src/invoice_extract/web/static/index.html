<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>invoice-extract</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>invoice-extract</h1>
    <label class="btn primary">
      Add invoices
      <input type="file" id="file-input" multiple accept=".pdf,.xml,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff" hidden>
    </label>
    <span class="drop-hint">PDFs, scans, photos, XRechnung or ZUGFeRD; drop them anywhere</span>
    <span class="spacer"></span>
    <div class="menu" id="export-menu">
      <button class="btn" id="export-button" aria-haspopup="true" aria-expanded="false">Export ▾</button>
      <div class="menu-list" hidden>
        <button class="menu-item" data-format="xlsx">Excel (.xlsx)</button>
        <button class="menu-item" data-format="csv">CSV (.csv)</button>
        <button class="menu-item" data-format="json">JSON (.json)</button>
      </div>
    </div>
    <button class="btn" id="clear-button">Clear</button>
  </header>

  <section class="results card">
    <p class="summary" id="summary"></p>
    <div class="table-wrap">
      <table id="table"></table>
    </div>
  </section>

  <main class="layout">
    <section class="viewer card">
      <div class="viewer-bar">
        <strong id="viewer-name">No invoice selected</strong>
        <span class="spacer"></span>
        <button class="btn small" id="toggle-document" hidden>Show e-invoice data</button>
        <button class="btn small" id="print-button" hidden>Print</button>
        <button class="btn small" id="prev-page" aria-label="Previous page">‹</button>
        <span id="page-label" class="muted"></span>
        <button class="btn small" id="next-page" aria-label="Next page">›</button>
      </div>
      <p class="muted viewer-help" id="viewer-help">Add invoices to start. Click a row to see the page and where each value was found; click a cell to correct it.</p>
      <div class="page-wrap" id="page-wrap" hidden>
        <img id="page-image" alt="Invoice page">
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <article class="sheet" id="document" hidden></article>
    </section>

    <aside class="panel">
      <section class="card">
        <h2>Values</h2>
        <dl class="values" id="values"></dl>
      </section>
      <section class="card">
        <h2>Checks</h2>
        <ul class="checks" id="checks"></ul>
      </section>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
