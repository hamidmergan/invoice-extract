<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>invoice-extract</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>invoice-extract</h1>
    <label class="btn primary">
      Add files
      <input type="file" id="file-input" multiple accept=".pdf,.xml,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff" hidden>
    </label>
    <span class="drop-hint">or drop PDFs, scans and e-invoices anywhere</span>
    <span class="spacer"></span>
    <span class="badge mode" id="mode-badge" hidden>Template</span>
    <button class="btn" id="all-fields-button" hidden>Use all fields</button>
    <a class="btn" href="/api/template" download="invoices.yaml" id="save-template">Save as template</a>
    <label class="btn">
      Load template
      <input type="file" id="template-input" accept=".yaml,.yml" hidden>
    </label>
    <div class="menu" id="export-menu">
      <button class="btn" id="export-button" aria-haspopup="true" aria-expanded="false">Export ▾</button>
      <div class="menu-list" hidden>
        <button class="menu-item" data-format="xlsx">Excel (.xlsx)</button>
        <button class="menu-item" data-format="csv">CSV (.csv / .zip)</button>
        <button class="menu-item" data-format="json">JSON (.json)</button>
      </div>
    </div>
    <button class="btn" id="clear-button">Clear</button>
    <a class="btn" href="/">E-invoices</a>
  </header>

  <main class="layout">
    <aside class="card fields">
      <h2 id="fields-title">Fields</h2>
      <p class="muted small-text" id="fields-help">Upload invoices. The model finds every field; untick what you do not need.</p>
      <div id="field-groups"></div>
    </aside>

    <section class="card viewer">
      <div class="viewer-bar">
        <button class="btn small" id="prev-file" aria-label="Previous invoice">‹</button>
        <strong id="viewer-name">No file selected</strong>
        <button class="btn small" id="next-file" aria-label="Next invoice">›</button>
        <span class="spacer"></span>
        <button class="btn small" id="prev-page" aria-label="Previous page">‹</button>
        <span id="page-label" class="muted"></span>
        <button class="btn small" id="next-page" aria-label="Next page">›</button>
      </div>
      <p class="muted viewer-help" id="viewer-help"></p>
      <div class="page-wrap" id="page-wrap" hidden>
        <img id="page-image" alt="Invoice page">
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <h3>Checks</h3>
      <ul class="checks" id="checks"></ul>
    </section>
  </main>

  <section class="card results">
    <div class="results-head">
      <p class="summary" id="summary"></p>
      <span class="spacer"></span>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
    <div class="table-wrap">
      <table id="table"></table>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
